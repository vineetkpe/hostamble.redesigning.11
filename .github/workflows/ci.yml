name: Clean starter validation
on:
  push:
    branches: [main, chore/restart-clean-slate]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Astro check
        run: npm run check
      - name: Cloudflare dry run, starting without dist
        run: |
          rm -rf dist
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Verify clean starter
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/_headers
          node -e "const fs = require('node:fs');const s=fs.readFileSync('dist/index.html','utf8');if(!s.includes('noindex, nofollow')||s.includes('data-pricing')||s.includes('domain-ticker'))process.exit(1)"
