name: Validate redesign
on:
  push:
    branches: [feat/hostamble-astro-redesign, feat/approved-brand-correction, main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Validate catalog and logic
        run: npm run validate:catalog && npm test
      - name: Astro checks
        run: npm run check
      # Simulate Cloudflare's exact deploy command from a fresh checkout:
      # dist/ must NOT exist before Wrangler invokes its configured build step.
      - name: Ensure no prebuilt dist exists
        run: |
          node -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"
      - name: Test Wrangler deploy from clean checkout (runs Astro build)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
        env:
          PUBLIC_SITE_STAGE: preview
      - name: Verify built files and preview protections
        run: npm run verify:build
      - name: Commit resolved dependency lockfile (feature branch)
        if: github.event_name == 'push' && github.ref_name == 'feat/hostamble-astro-redesign'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: commit dependency lockfile [skip ci]"
            git push origin HEAD:feat/hostamble-astro-redesign
          fi
