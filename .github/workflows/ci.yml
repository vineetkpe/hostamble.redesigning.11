name: Verify native Astro site
on:
  push:
    branches: [main, feat/content-audit-and-product-pages]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro type and markup check
        run: npm run check
      - name: Build from clean output and test Cloudflare assets
        run: |
          rm -rf dist
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Validate site content and routes
        run: npm run validate:content
      - name: Install browser smoke dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.58.0
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chromium
            echo "CHROME_BIN=$HOME/.cache/ms-playwright/chromium-*/chrome-linux/chrome" >> "$GITHUB_ENV"
          fi
      - name: Browser smoke across mobile and desktop
        run: npm run test:browser
